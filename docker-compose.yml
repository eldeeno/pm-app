services:
  app:
    build:
      context: .
      dockerfile: docker/common/php-fpm/Dockerfile
    container_name: laravel-pm-app
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - laravel

  vite:
    image: node:18
    container_name: pm-vite
    working_dir: /var/www/html
    command: [ "npm", "run", "dev" ]
    volumes:
      - ./src:/var/www/html
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/development/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:latest
    container_name: laravel-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: pm_app_db
      MYSQL_USER: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: laravel
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin:5.2.1
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    depends_on:
      - db
    networks:
      - laravel

volumes:
  db-data:

networks:
  laravel:
    driver: bridge